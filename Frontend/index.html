<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#07080c">
<title>Samson AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d7cff'/%3E%3Cstop offset='.5' stop-color='%23a855f7'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M42 21c-2-4-6-6-10-6-6 0-10 3-10 8 0 11 20 5 20 17 0 5-4 8-10 8-5 0-9-2-11-7' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="aurora"><i></i><i></i><i></i></div>
<div class="grain"></div>

<!-- Reusable logo mark -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7cff"/>
      <stop offset=".55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="lgs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#d9defe"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lg)"/>
      <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
      <path d="M2 24C14 14 30 12 62 20V44C34 36 18 40 2 50Z" fill="rgba(255,255,255,.08)"/>
      <path d="M43 21.5c-2.2-4.2-6.4-6.5-11.2-6.5-6.4 0-10.8 3.4-10.8 8.4 0 11.8 21.8 5.4 21.8 18.2 0 5.4-4.6 8.9-11.2 8.9-5.5 0-9.8-2.4-12-7.4" fill="none" stroke="url(#lgs)" stroke-width="6.2" stroke-linecap="round"/>
      <path d="M49 9l1.6 4.4L55 15l-4.4 1.6L49 21l-1.6-4.4L43 15l4.4-1.6z" fill="#fff"/>
    </symbol>
  </defs>
</svg>

<header>
  <a class="brand" href="/">
    <svg class="logo"><use href="#mark"/></svg>
    <div class="wordmark"><b>Samson</b><span>AI</span></div>
  </a>
</header>

<main class="stage" id="stage">
  <div class="inner">
    <div class="hero" id="hero">
      <div class="orb"><svg><use href="#mark"/></svg></div>
      <h1>What can I help you with?</h1>
      <p>Ask anything. Samson AI is ready.</p>
      <div class="chips">
        <button class="chip">Who Made You ?</button>
        <button class="chip">Explain a complex topic simply</button>
        <button class="chip">Help me write a professional email</button>
        
      </div>
    </div>
    <div id="thread"></div>
  </div>
</main>

<div class="dock">
  <div class="composer-wrap" id="wrap">
    <div class="glow-blur"></div>
    <div class="glow"></div>
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="Message Samson AI…" autofocus></textarea>

            <div class="model" id="model">
        <button type="button" class="model-btn" id="modelBtn" aria-haspopup="listbox" aria-expanded="false">
          <span id="modelLabel">Samson AI</span>
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="model-menu" id="modelMenu" role="listbox">
          <button type="button" class="model-opt active" data-model="samson" role="option">
            <b>Sam Logic</b><span>Smart and Examples answers</span>
          </button>
          <button type="button" class="model-opt" data-model="quick" role="option">
            <b>Sam Turbo 2.1</b><span> Fast & Detailed answers replies</span>
          </button>
        </div>
      </div>

      <button id="send" aria-label="Send message">
        <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="foot">Samson AI does not store your conversations.</div>
</div>

<script src="script.js"></script>
</body>
</html>
